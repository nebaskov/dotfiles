# HotPurpleTrafficLight theme for tmux
# Matching btop's HotPurpleTrafficLight by Pete Allebone
#
# Place at: ~/.config/tmux/hotpurpletrafficlight.tmux.conf
# Then source in your tmux.conf:
#   source-file ~/.config/tmux/hotpurpletrafficlight.tmux.conf

# Pane indexing
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ── Pane borders ──────────────────────────────────────────────
set -g pane-border-style "fg=#4d4dff"             # div_line blue-purple
set -g pane-active-border-style "fg=#a64dff"       # box outline purple

# ── Status bar ────────────────────────────────────────────────
set -g status-style "bg=#000000,fg=#d1d1e0"

set -g window-status-separator ""
set -g status-position top
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80

# Left: empty
set -g status-left ""

# Right: battery + time with traffic-light-style accents
set -g status-right "#[fg=#d1d1e0,bg=#8b5cf6] bat #{battery_percentage} #[fg=#d1d1e0,bg=#7c3aed] %H:%M #[fg=#000000,bg=#b07cff,bold] #S "

# ── Window tabs ───────────────────────────────────────────────

# Rename
set-option -wg automatic-rename on
set-option -wg automatic-rename-format "#{pane_current_command}"

# Inactive windows: dim purple
set -g window-status-style "fg=#9999ff,bg=#000000"
set -g window-status-format "  #I:#W  "

# Active window: bright purple highlight
set -g window-status-current-style "fg=#d1d1e0,bg=#6666ff,bold"
set -g window-status-current-format "  #I:#W  "

# Window with activity: orange flash (traffic light warning)
set -g window-status-activity-style "fg=#ff9933,bg=#000000,bold"

# Separator between windows
set -g window-status-separator ""

# ── Message / command prompt ──────────────────────────────────
set -g message-style "fg=#d1d1e0,bg=#6666ff,bold"
set -g message-command-style "fg=#d1d1e0,bg=#4d4dff"

# ── Mode (copy mode, etc.) ────────────────────────────────────
set -g mode-style "fg=#d1d1e0,bg=#6666ff"

# ── Clock ─────────────────────────────────────────────────────
set -g clock-mode-colour "#9933ff"
