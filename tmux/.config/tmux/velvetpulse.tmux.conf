# ╔══════════════════════════════════════════════════╗
# ║  Velvet Pulse — tmux theme                      ║
# ║  Born from HotPurpleTrafficLight, softened       ║
# ║  for those who live in the terminal.             ║
# ╚══════════════════════════════════════════════════╝
#
# Place at: ~/.config/tmux/velvetpulse.tmux.conf
# Then source in your tmux.conf:
#   source-file ~/.config/tmux/velvetpulse.tmux.conf

# ── Pane borders ──────────────────────────────────────────────
set -g pane-border-style "fg=#5c5c8a"
set -g pane-active-border-style "fg=#9a6adb"

# ── Status bar ────────────────────────────────────────────────
set -g status-style "bg=#0d0d1a,fg=#c8c8d8"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80

# Left: empty (session name moved to right)
set -g status-left ""

# Right: battery + time + session
set -g status-right "#[fg=#8b7aad]bat #{battery_percentage} #[fg=#0d0d1a,bg=#0d0d1a]#[fg=#c8c8d8,bg=#7c3aed] %H:%M #[fg=#0d0d1a,bg=#b07cff,bold] #S "

# ── Window tabs ───────────────────────────────────────────────
set -g window-status-style "fg=#6a6a8a,bg=#0d0d1a"
set -g window-status-format "  #I:#W  "

set -g window-status-current-style "fg=#c8c8d8,bg=#2e2e5c,bold"
set -g window-status-current-format "  #I:#W  "

set -g window-status-activity-style "fg=#d9a06a,bg=#0d0d1a,bold"

set -g window-status-separator ""

# ── Message / command prompt ──────────────────────────────────
set -g message-style "fg=#c8c8d8,bg=#2e2e5c,bold"
set -g message-command-style "fg=#c8c8d8,bg=#181828"

# ── Mode (copy mode, etc.) ────────────────────────────────────
set -g mode-style "fg=#c8c8d8,bg=#2e2e5c"

# ── Clock ─────────────────────────────────────────────────────
set -g clock-mode-colour "#b07cff"
