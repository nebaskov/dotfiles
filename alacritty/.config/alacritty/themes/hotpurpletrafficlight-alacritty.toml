# HotPurpleTrafficLight theme for Alacritty
# Matching btop's HotPurpleTrafficLight by Pete Allebone
# Place at: ~/.config/alacritty/themes/hotpurpletrafficlight.toml
# Then import in your alacritty.toml:
#   [general]
#   import = ["~/.config/alacritty/themes/hotpurpletrafficlight.toml"]

[colors.primary]
background = "#000000"
foreground = "#d1d1e0"

[colors.cursor]
text    = "#000000"
cursor  = "#9933ff"

[colors.vi_mode_cursor]
text    = "#000000"
cursor  = "#a64dff"

[colors.selection]
text       = "#d1d1e0"
background = "#6666ff"

[colors.search.matches]
foreground = "#000000"
background = "#ff9933"

[colors.search.focused_match]
foreground = "#000000"
background = "#00ff00"

[colors.hints.start]
foreground = "#000000"
background = "#ff9933"

[colors.hints.end]
foreground = "#000000"
background = "#a64dff"

# Normal colors
[colors.normal]
black   = "#1a1a2e"    # slightly visible black (not pure black, so text is readable on bg)
red     = "#ff0000"    # traffic light red
green   = "#00ff00"    # traffic light green
yellow  = "#ccff66"    # yellow-green from graph midpoints
blue    = "#4d4dff"    # blue-purple (meter bg / divider)
magenta = "#9933ff"    # the signature hot purple
cyan    = "#9999ff"    # inactive/cool purple used as cyan
white   = "#d1d1e0"    # main fg

# Bright colors
[colors.bright]
black   = "#33334d"    # brighter gutter
red     = "#ff3333"    # brighter red
green   = "#33ff33"    # brighter green
yellow  = "#ff9933"    # orange accent from temp/download graphs
blue    = "#6666ff"    # selection blue-purple
magenta = "#a64dff"    # box outline purple
cyan    = "#b3b3ff"    # lighter inactive
white   = "#eeeef5"    # bright white
